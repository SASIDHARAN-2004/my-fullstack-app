<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>HR Portal - Register</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <main class="card">
        <h1>HR Portal</h1>
        <h2>Create account</h2>
        <form id="registerForm"><label>Email</label><input id="email" type="email"
                required><label>Password</label><input id="password" type="password" required
                minlength="4"><button>Register</button></form>
        <p id="message"></p>
        <p>Already registered? <a href="login.html">Login</a></p>
    </main>
    <script src="register.js"></script>
</body>

</html>
